  name: CI

  on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkoutv4
        - name: set up JDK 21
        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven
        - name: Build and test
          run: mvn -B verify

